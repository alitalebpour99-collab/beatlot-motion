<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Beatlot promo 9:16</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="kit.css">
<script src="gsap.min.js"></script>
<script src="kit.js"></script>
<style>
#root { width: 1080px; height: 1920px; background: var(--cream); }
#glow { position: absolute; left: 50%; top: 52%; width: 1500px; height: 1500px; margin: -750px 0 0 -750px; border-radius: 50%; background: radial-gradient(closest-side, rgba(217,179,106,.36), rgba(217,179,106,0)); }
/* scene A: raw clips in */
#sa { position: absolute; inset: 0; }
#eyebrow { position: absolute; top: 150px; left: 0; right: 0; text-align: center; }
#eyebrow span { display: inline-flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 600; color: var(--gold-lo); border: 2px solid rgba(184,138,62,.42); border-radius: 999px; padding: 10px 28px 10px 20px; }
#eyebrow i { width: 12px; height: 12px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 7px rgba(184,138,62,.16); }
#h1 { position: absolute; top: 250px; left: 0; right: 0; text-align: center; font-size: 172px; line-height: 1; }
.raw { position: absolute; top: 760px; width: 300px; height: 533px; border-radius: 24px; overflow: hidden; box-shadow: 0 30px 60px -24px rgba(13,12,10,.7); background: #222; }
.raw img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.82) contrast(.92) brightness(1.04); }
.raw .rec { position: absolute; left: 18px; top: 16px; display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px #000; }
.raw .rec i { width: 12px; height: 12px; border-radius: 50%; background: #e5484d; }
.raw .fmt { position: absolute; right: 16px; top: 16px; font-size: 20px; font-weight: 600; color: #fff; text-shadow: 0 1px 3px #000; opacity: .9; }
.raw .shut { position: absolute; left: 50%; bottom: 22px; width: 64px; height: 64px; margin-left: -32px; border-radius: 50%; border: 4px solid #fff; display: grid; place-items: center; }
.raw .shut::after { content: ''; width: 22px; height: 22px; border-radius: 4px; background: #e5484d; }
#rawcap { position: absolute; top: 1380px; left: 0; right: 0; text-align: center; font-size: 34px; color: var(--mute); }
/* scene B: the chat */
#chat { position: absolute; left: 36px; top: 96px; width: 1008px; height: 1764px; border-radius: 60px; overflow: hidden; box-shadow: 0 60px 120px -50px rgba(13,12,10,.8); z-index: 3; }
.head { position: absolute; left: 0; right: 0; top: 0; height: 132px; display: flex; align-items: center; gap: 22px; padding: 0 36px; border-bottom: 2px solid rgba(217,179,106,.14); }
.av { width: 80px; height: 80px; border-radius: 50%; display: grid; place-items: center; background: var(--ink-3); border: 2px solid rgba(217,179,106,.35); color: var(--gold-hi); }
.av svg { width: 46px; height: 46px; }
.who b { display: block; font-family: 'Bodoni Moda', serif; font-size: 44px; font-weight: 600; line-height: 1.1; }
.who small { display: flex; align-items: center; gap: 10px; font-size: 26px; color: var(--mute-d); }
.who small i { width: 11px; height: 11px; border-radius: 50%; background: #7fbf8a; }
#body { position: absolute; left: 0; right: 0; top: 132px; bottom: 150px; padding: 26px 30px; display: flex; flex-direction: column; justify-content: flex-end; gap: 22px; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 90px); mask-image: linear-gradient(180deg, transparent 0, #000 90px); }
.msg { font-size: 34px; line-height: 1.45; padding: 20px 28px; border-radius: 36px; }
.me { border-bottom-right-radius: 12px; }
.bot { border-bottom-left-radius: 12px; }
.clips3 { display: flex; gap: 14px; padding: 14px; }
.clips3 div { width: 168px; height: 270px; border-radius: 18px; overflow: hidden; }
.clips3 img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.82) contrast(.92) brightness(1.04); }
.typing { gap: 10px; padding: 30px 32px; }
.typing i { width: 14px; height: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
.chip { font-size: 27px; padding: 6px 20px; }
.reelmsg { max-width: 100%; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 30px 20px 26px; }
#gf { position: relative; width: 570px; height: 1013px; }
#ph { left: 10px; top: 10px; right: 10px; bottom: 10px; }
#ph .brandtag { top: 28px; font-size: 16px; letter-spacing: .32em; }
#ph .endcard { padding: 0 20px 22%; gap: 12px; }
#ph .endcard .lg { width: 170px; height: 102px; border-radius: 12px; overflow: hidden; }
#ph .endcard .lg svg { width: 100%; height: 100%; display: block; }
#ph .endcard b { font-family: 'Bodoni Moda', serif; font-size: 40px; font-weight: 600; }
#ph .endcard .ln { width: 56px; height: 2px; }
#ph .endcard .cta { font-size: 25px; }
#ph .endcard small { font-size: 22px; }
#mt { position: relative; }
.qa { display: flex; justify-content: center; gap: 30px; font-size: 28px; }
.q { gap: 10px; }
.q svg { width: 30px; height: 30px; }
.acts { display: flex; justify-content: center; gap: 14px; }
.acts button { font-size: 28px; padding: 14px 26px; gap: 10px; }
.acts small { font-size: 22px; }
#okring { position: absolute; inset: -10px; border-radius: 999px; box-shadow: 0 0 0 10px rgba(217,179,106,.28); opacity: 0; }
.inbar { position: absolute; left: 30px; right: 30px; bottom: 30px; height: 96px; display: flex; align-items: center; gap: 18px; padding: 0 12px 0 32px; border: 2px solid rgba(217,179,106,.22); border-radius: 999px; }
.field { flex: 1; font-size: 34px; white-space: nowrap; overflow: hidden; position: relative; }
.field .ph { color: rgba(243,236,223,.35); }
.send { width: 72px; height: 72px; border-radius: 50%; background: var(--gold-hi); color: var(--ink); display: grid; place-items: center; }
.send svg { width: 34px; height: 34px; }
/* scene C: the name */
#end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 1; }
#emark { width: 150px; height: 150px; color: var(--gold); }
#emark svg { width: 100%; height: 100%; }
#emark .mk { stroke-dasharray: 1; stroke-dashoffset: 1; }
#ename { font-size: 210px; line-height: 1; margin-top: 18px; }
#eline { position: relative; margin: 34px auto 0; }
#etag { font-size: 70px; line-height: 1.15; margin-top: 46px; }
#etag em { font-style: italic; color: var(--gold); }
#esub { font-size: 36px; color: var(--mute); margin-top: 26px; }
#ecta { display: inline-flex; align-items: center; gap: 16px; margin-top: 70px; background: var(--ink); color: var(--cream); font-size: 36px; font-weight: 600; padding: 30px 52px; border-radius: 999px; box-shadow: 0 24px 50px -22px rgba(13,12,10,.7); }
#ecta svg { width: 40px; height: 40px; color: var(--gold-hi); }
#eprice { font-size: 32px; color: var(--gold-lo); margin-top: 26px; font-weight: 600; }
</style>
</head>
<body>
<div id="root" data-composition-id="promo" data-start="0" data-duration="19.048" data-width="1080" data-height="1920" data-fps="30">
  <div id="glow"></div>

  <div id="end">
    <div id="emark"></div>
    <div id="ename" class="disp"></div>
    <div id="eline" class="meter"></div>
    <div id="etag" class="disp"></div>
    <div id="esub"></div>
    <div><span id="ecta"></span></div>
    <div id="eprice"></div>
  </div>

  <div id="sa">
    <div id="eyebrow"><span><i></i><b id="eyetxt" style="font-weight:600"></b></span></div>
    <div id="h1" class="disp"></div>
    <div class="raw" id="c1" style="left:96px"><img src="assets/img/clip-grille.jpg" alt=""><span class="rec"><i></i>0:06</span><span class="fmt">720p</span><span class="shut"></span></div>
    <div class="raw" id="c2" style="left:390px"><img src="assets/img/clip-wheel.jpg" alt=""><span class="rec"><i></i>0:04</span><span class="fmt">720p</span><span class="shut"></span></div>
    <div class="raw" id="c3" style="left:684px"><img src="assets/img/clip-front.jpg" alt=""><span class="rec"><i></i>0:09</span><span class="fmt">720p</span><span class="shut"></span></div>
    <div id="rawcap"></div>
  </div>

  <div id="chat" class="card-dark">
    <div class="head"><span class="av"></span><div class="who"><b>Beatlot</b><small><i></i><span id="status"></span></small></div></div>
    <div id="body">
      <div class="row" id="r1"><div class="msg me clips3"><div><img src="assets/img/clip-grille.jpg" alt=""></div><div><img src="assets/img/clip-wheel.jpg" alt=""></div><div><img src="assets/img/clip-front.jpg" alt=""></div></div></div>
      <div class="row" id="r2"><div class="msg me" id="sent"></div></div>
      <div class="row" id="r3"><div class="msg bot typing" id="dots"><i></i><i></i><i></i></div></div>
      <div class="row" id="r4"><div class="msg bot"><div id="reply"></div><div class="chips" id="chips"></div></div></div>
      <div class="row" id="r5"><div class="msg bot reelmsg">
        <div class="gframe" id="gf">
          <div class="phone" id="ph">
            <div class="shot"><img src="assets/img/grille.jpg" alt=""></div>
            <div class="shot"><img src="assets/img/wheel.jpg" alt=""></div>
            <div class="shot"><img src="assets/img/c-class-34.jpg" alt=""></div>
            <div class="shot"><img src="assets/img/e-class.jpg" alt=""></div>
            <div class="brandtag" id="btag"></div>
            <div class="flash" id="fl"></div>
            <div class="endcard" id="ec"><span class="lg" id="eclogo"></span><b id="ecname"></b><i class="ln"></i><span class="cta" id="eccta"></span><small id="echandle"></small></div>
          </div>
        </div>
        <div class="meter" id="mt"></div>
        <div class="qa" id="qa"></div>
        <div class="acts" id="acts"></div>
      </div></div>
      <div class="row" id="r6"><div class="msg bot" id="done"></div></div>
    </div>
    <div class="inbar"><div class="field"><span id="typed"></span><span class="ph" id="phold"></span></div><span class="send"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.4-7.5c.8-.4.8-1.5 0-1.8L3.4 3.6c-.7-.3-1.4.3-1.2 1l1.6 5.9 8.2 1.5-8.2 1.5-1.6 5.9c-.2.7.5 1.3 1.2 1z"/></svg></span></div>
  </div>
</div>

<script>
(function () {
  var LANG = '__LANG__'.indexOf('__') === 0 ? 'en' : '__LANG__';
  var BRAND = 'Beatlot';
  var T = {
    en: { eyebrow: 'Reels studio for car dealers', h1: 'Raw clips in.', rawcap: 'Three phone clips. Nothing else.', status: 'assistant, online', ph: 'Message', typed: 'make it pop',
      reply: 'On it. Faster cuts, a gold flash on the drop, your end card.', chips: ['126 BPM', 'Reveal on the drop', 'Your end card'],
      qa: ['beat sync', 'plates', 'logo'], ok: 'Approve', chg: 'Change', alt: 'Another version', cr: '1 credit', dm: 'DM for details',
      done: 'Approved. Saved to your gallery, ready to post.', tagA: 'Raw clips in.', tagB: 'Reels out.', sub: 'Your assistant cuts them on the beat, in your brand.', cta: 'Start in Telegram', price: 'From €7 a month. No editing app.' },
    de: { eyebrow: 'Reels-Studio für Autohändler', h1: 'Rohe Clips rein.', rawcap: 'Drei Handyclips. Sonst nichts.', status: 'Assistent, online', ph: 'Nachricht', typed: 'mach’s knallig',
      reply: 'Mach ich. Schnellere Schnitte, goldener Blitz auf dem Drop, deine Endkarte.', chips: ['126 BPM', 'Enthüllung auf dem Drop', 'Deine Endkarte'],
      qa: ['im Takt', 'Kennzeichen', 'Logo'], ok: 'Freigeben', chg: 'Ändern', alt: 'Andere Version', cr: '1 Credit', dm: 'Infos per DM',
      done: 'Freigegeben. In deiner Galerie, bereit zum Posten.', tagA: 'Rohe Clips rein.', tagB: 'Reels raus.', sub: 'Dein Assistent schneidet sie im Takt, in deinem Branding.', cta: 'In Telegram starten', price: 'Ab 7 € im Monat. Keine Schnitt-App.' }
  }[LANG];
  var K = window.KIT, B = K.B, $ = K.$, $$ = K.$$;
  var L = K.LOGOS.kestrel;
  document.documentElement.lang = LANG;

  // ---- content
  $('#eyetxt').textContent = T.eyebrow;
  var h1w = K.words($('#h1'), T.h1);
  $('#rawcap').textContent = T.rawcap;
  $('.av').innerHTML = K.MARK; $('.who b').textContent = BRAND;
  $('#status').textContent = T.status; $('#phold').textContent = T.ph;
  var typedCh = K.typed($('#typed'), T.typed);
  $('#sent').textContent = T.typed;
  $('#reply').textContent = T.reply;
  $('#chips').innerHTML = T.chips.map(function (c) { return '<span class="chip">' + K.esc(c) + '</span>'; }).join('');
  $('#gf').insertAdjacentHTML('afterbegin', K.EDGES);
  $('#btag').textContent = L.name;
  $('#eclogo').innerHTML = L.svg; $('#ecname').textContent = L.name; $('#eccta').textContent = T.dm; $('#echandle').textContent = L.handle;
  var M = K.meter($('#mt'), { width: 540, bars: 32, gap: 4, waveH: 44, gapY: 10, tick: 10, dot: 16 });
  $('#qa').innerHTML = T.qa.map(function (q) { return '<span class="q">' + K.CHK + '<span>' + K.esc(q) + '</span></span>'; }).join('');
  $('#acts').innerHTML = '<button class="ok" style="position:relative"><span id="okring"></span>' + K.esc(T.ok) + '</button><button>' + K.esc(T.chg) + '<small>' + K.esc(T.cr) + '</small></button><button>' + K.esc(T.alt) + '<small>' + K.esc(T.cr) + '</small></button>';
  $('#done').textContent = T.done;
  $('#emark').innerHTML = K.MARK;
  $('#ename').textContent = BRAND;
  var EM = K.meter($('#eline'), { width: 640, bars: 0, ticks: 8, drop: -1, gap: 0, waveH: 0, gapY: 0, tick: 16, dot: 22 });
  $('#etag').innerHTML = '<span id="tA"></span> <em id="tB"></em>';
  var tA = K.words($('#tA'), T.tagA), tB = K.words($('#tB'), T.tagB);
  $('#esub').textContent = T.sub;
  $('#ecta').innerHTML = K.TG + '<span>' + K.esc(T.cta) + '</span>';
  $('#eprice').textContent = T.price;

  var tl = gsap.timeline({ paused: true });
  // keep the whole length on the timeline
  tl.set({}, {}, B(40));

  // ---- A. raw clips in (beats 0 to 4)
  tl.fromTo('#eyebrow', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: B(.8), ease: 'power3.out' }, 0);
  K.rise(tl, h1w, 0, .25, 1);
  [['#c1', -7], ['#c2', 3], ['#c3', 8]].forEach(function (c, i) {
    // each clip lands exactly on a beat: 1, 2, 3
    tl.fromTo(c[0], { y: -1500, rotation: c[1] * 4 }, { y: 0, rotation: c[1], duration: B(.62), ease: 'power3.in' }, B(i + 1 - .62));
    tl.fromTo(c[0], { scale: 1.06 }, { scale: 1, duration: B(.5), ease: 'back.out(3)' }, B(i + 1));
  });
  tl.fromTo('#rawcap', { opacity: 0 }, { opacity: 1, duration: B(.6) }, B(3));
  tl.fromTo('#glow', { scale: .8, opacity: .6 }, { scale: 1, opacity: 1, duration: B(4), ease: 'power1.out' }, 0);

  // ---- B. the chat (beats 4 to 32)
  tl.fromTo('#chat', { y: 1900 }, { y: 0, duration: B(.75), ease: 'power3.out' }, B(4));
  tl.to(['#h1', '#eyebrow', '#rawcap'], { opacity: 0, y: -60, duration: B(.5), ease: 'power2.in' }, B(4));
  tl.to(['#c1', '#c2', '#c3'], { y: 520, scale: .45, opacity: 0, duration: B(.6), ease: 'power2.in' }, B(4));
  tl.set('#sa', { opacity: 0 }, B(4.8));
  K.row(tl, '#r1', 4.5);
  tl.fromTo($$('#r1 .clips3 div'), { y: -60, opacity: 0, rotation: function (i) { return [-8, 6, -4][i]; } }, { y: 0, opacity: 1, rotation: function (i) { return [-3, 2, -1][i]; }, duration: B(.7), stagger: B(.25), ease: 'back.out(2)' }, B(4.6));
  // "make it pop" typed over one beat, sent on beat 6
  tl.set('#phold', { opacity: 0 }, B(5));
  K.type(tl, typedCh, 5, 1);
  tl.set(typedCh, { opacity: 0 }, B(6));
  tl.set('#phold', { opacity: 1 }, B(6));
  K.row(tl, '#r2', 6);
  // the assistant thinks: three dots pulse with the beat
  K.row(tl, '#r3', 6.5, .4);
  [7, 8].forEach(function (b) { tl.fromTo($$('#dots i'), { y: 0, opacity: .45 }, { y: -8, opacity: 1, duration: B(.17), stagger: B(.17), yoyo: true, repeat: 1, ease: 'power1.out' }, B(b)); });
  tl.to('#r3', { height: 0, opacity: 0, duration: B(.3), ease: 'power2.in' }, B(8.7));
  K.row(tl, '#r4', 9);
  $$('#chips .chip').forEach(function (c, i) { tl.fromTo(c, { opacity: 0, scale: .6 }, { opacity: 1, scale: 1, duration: B(.5), ease: 'back.out(3)' }, B(9.5 + i * .5)); });
  // the Reel arrives inside the gold frame: one edge per half beat
  K.row(tl, '#r5', 11, .8);
  K.frame(tl, '#gf', 11, .25);
  tl.fromTo(M.dot, { opacity: 0 }, { opacity: 1, duration: B(.3) }, B(11.5));
  // 16 beats of Reel, beat 12 to 28; the car arrives on the drop (Reel beat 8 = beat 20 = the song's drop)
  var R0 = 12, shots = $$('#ph .shot');
  for (var r = 0; r < 16; r++) M.step(tl, r, R0 + r, r === 8 ? 1.5 : 1.22);
  K.cut(tl, shots, 0, R0 + 0, 2, 1.22, 1.1);
  K.cut(tl, shots, 1, R0 + 2, 2, 1.2, 1.08);
  K.cut(tl, shots, 2, R0 + 4, 1, 2.3, 2.15, '16% 63%');   // headlight
  K.cut(tl, shots, 0, R0 + 5, 1, 2.1, 1.95, '48% 44%');   // the star
  K.cut(tl, shots, 1, R0 + 6, 1, 1.9, 1.78, '56% 70%');   // the rim
  K.cut(tl, shots, 3, R0 + 7, 1, 2.5, 2.3, '50% 63%');    // the next star
  K.cut(tl, shots, 2, R0 + 8, 4, 1.16, 1);                 // the drop: the whole car
  tl.fromTo('#fl', { opacity: 1 }, { opacity: 0, duration: B(1), ease: 'power2.out', immediateRender: false }, B(R0 + 8));
  tl.fromTo('#gf', { scale: 1.045 }, { scale: 1, duration: B(.6), ease: 'back.out(3)', immediateRender: false }, B(R0 + 8));
  tl.fromTo('#glow', { scale: 1.25, opacity: 1 }, { scale: 1, opacity: .85, duration: B(2), ease: 'power2.out', immediateRender: false }, B(R0 + 8));
  K.cut(tl, shots, 3, R0 + 12, 2, 1.12, 1.03);
  tl.fromTo('#ec', { opacity: 0 }, { opacity: 1, duration: B(.5) }, B(R0 + 14));
  tl.fromTo($$('#ec > *'), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: B(.6), stagger: B(.2), ease: 'power3.out' }, B(R0 + 14));
  // checked, then one tap
  $$('#qa .q').forEach(function (q, i) { tl.fromTo(q, { opacity: 0, scale: .4 }, { opacity: 1, scale: 1, duration: B(.6), ease: 'back.out(3)' }, B(28 + i * .5)); });
  tl.fromTo($$('#acts button'), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: B(.6), stagger: B(.25), ease: 'power3.out' }, B(29.5));
  tl.fromTo('#acts .ok', { scale: .9 }, { scale: 1, duration: B(.6), ease: 'back.out(3)', immediateRender: false }, B(31));
  tl.fromTo('#okring', { opacity: 0 }, { opacity: 1, duration: B(.3) }, B(31));
  K.row(tl, '#r6', 31.5);

  // ---- C. the name (beats 32 to 40)
  tl.to('#chat', { y: 1950, duration: B(.8), ease: 'power3.in' }, B(32));
  tl.fromTo('#end', { opacity: 0 }, { opacity: 1, duration: B(.4) }, B(32.4));
  tl.fromTo('#emark .mk', { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: B(1), stagger: B(.25), ease: 'power2.inOut' }, B(32.5));
  tl.fromTo('#emark .mkd', { scale: 0, transformOrigin: '50% 50%' }, { scale: 1, transformOrigin: '50% 50%', duration: B(.5), ease: 'back.out(3)' }, B(33.5));
  tl.fromTo('#ename', { opacity: 0, y: 40, letterSpacing: '.06em' }, { opacity: 1, y: 0, letterSpacing: '-.012em', duration: B(1.2), ease: 'power3.out' }, B(33));
  tl.fromTo(EM.dot, { opacity: 0 }, { opacity: 1, duration: B(.2) }, B(33));
  for (var e = 0; e < 7; e++) EM.step(tl, e, 33 + e, false);
  K.rise(tl, tA, 34, .25, 1); K.rise(tl, tB, 35, .25, 1);
  tl.fromTo('#esub', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: B(.8), ease: 'power3.out' }, B(36));
  tl.fromTo('#ecta', { opacity: 0, y: 30, scale: .94 }, { opacity: 1, y: 0, scale: 1, duration: B(.8), ease: 'back.out(2)' }, B(37));
  tl.fromTo('#eprice', { opacity: 0 }, { opacity: 1, duration: B(.8) }, B(37.5));
  tl.fromTo('#glow', { scale: 1 }, { scale: 1.12, duration: B(7), ease: 'none', immediateRender: false }, B(33));

  window.__timelines = window.__timelines || {};
  window.__timelines.promo = tl;
})();
</script>
