  $('#say').textContent = T.say; $('#plan').textContent = T.plan; $('#zero').textContent = T.zero;
  $('#chips').innerHTML = T.chips.map(function (c) { return '<span class="chip">' + K.esc(c) + '</span>'; }).join('');
  // the Reel
  var Lk = K.LOGOS.kestrel;
  $('#gf').insertAdjacentHTML('afterbegin', K.EDGES);
  $('#btag').textContent = Lk.name; $('#eclogo').innerHTML = Lk.svg; $('#ecname').textContent = Lk.name; $('#eccta').textContent = T.dm; $('#echandle').textContent = Lk.handle;
  var M = K.meter($('#mt'), { width: 400, bars: 32, gap: 3, waveH: 34, gapY: 8, tick: 8, dot: 14 });
  $('#qa').innerHTML = T.qa.map(function (q) { return '<div class="q">' + K.CHK + '<span>' + K.esc(q) + '</span></div>'; }).join('');
  $('#oktxt').textContent = T.ok;
  // brand kit
  $('#logobox').innerHTML = Lk.svg; $('#kitme').textContent = T.me;
  $('#sws').innerHTML = T.sw.map(function (s) { return '<div class="sw"><i></i><b>------</b><small>' + K.esc(s) + '</small></div>'; }).join('');
  $('#t1').insertAdjacentHTML('afterbegin', K.EDGES); $('#t2').insertAdjacentHTML('afterbegin', K.EDGES);
  $('#tcta').textContent = T.dm;
  $$('#kit .dn').forEach(function (e) { e.textContent = Lk.name; }); $('#kit .dl').innerHTML = Lk.svg;
  // pricing
  var P = [[7, 3], [29, 12], [79, 40]], OC = [];
  P.forEach(function (p, i) {
    var n = i + 1, plan = $('#pn' + n).parentNode;
    $('#pn' + n).textContent = T.plans[i];
    $('.pre', plan).textContent = LANG === 'en' ? '€' : '';
    $('.suf', plan).textContent = LANG === 'en' ? '' : ' €';
    $('.per', plan).textContent = T.per;
    OC.push(K.odo($('#o' + n), p[0]));
    $('#rl' + n).textContent = T.reels.replace('{n}', p[1]);
    $('#f' + n).innerHTML = T.feats[i].map(function (f) { return '<li>' + K.esc(f) + '</li>'; }).join('');
  });
  $('#pfr').innerHTML = K.EDGES; $('#need').textContent = T.need; $('#need').style.left = '264px';
  $('#toks').innerHTML = T.toks.map(function (x, i) { return '<div class="tok"><span class="coins">' + (i === 0 ? '<span class="z"></span>' : i === 1 ? '<i></i>' : '<i></i><i></i>') + '</span><b>' + K.esc(x[0]) + '</b><small>' + K.esc(x[1]) + '</small></div>'; }).join('');
  // end
  $('#emark').innerHTML = K.MARK;
  $('#etag').innerHTML = '<span id="tA"></span> <em id="tB"></em>';
  var tA = K.words($('#tA'), T.tagA), tB = K.words($('#tB'), T.tagB);
  $('#ecta').innerHTML = K.TG + '<span>' + K.esc(T.cta) + '</span>';
  $('#esub').textContent = T.sub;

  var tl = gsap.timeline({ paused: true });
  tl.set({}, {}, B(64));
  // hidden until their section
  tl.set(['#b1', '#b2', '#b3', '#b4', '#b5', '#reel', '#kit', '#price', '#end'], { opacity: 0 }, 0);

  // ---- the rail: the dot jumps on each bar, pulses on each beat
  for (var bar = 0; bar < 16; bar++) {
    tl.set('#rdot', { x: bar / 16 * RW }, B(bar * 4));
    tl.set('#rail .fill', { scaleX: bar / 16 }, B(bar * 4));
  }
  tl.set('#rail .fill', { scaleX: 1 }, B(63.5));
  tl.set('#rdot', { x: RW }, B(63.5));
  for (var b = 0; b < 64; b++) tl.fromTo('#rdot', { scale: b % 4 ? 1.35 : 1.8 }, { scale: 1, duration: B(.6), ease: 'power2.out', immediateRender: false }, B(b));

  function swapOut(sel, at) { tl.to(sel, { opacity: 0, y: -30, duration: B(.5), ease: 'power2.in' }, B(at)); }
  function swapIn(sel, words, at) {
    tl.fromTo(sel, { opacity: 0, y: 0 }, { opacity: 1, y: 0, duration: B(.3), immediateRender: false }, B(at));
    tl.fromTo($(sel + ' .kick'), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: B(.6), ease: 'power3.out' }, B(at));
    K.rise(tl, words, at + .25, .25, 1);
    var p = $(sel + ' p'); if (p) tl.fromTo(p, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: B(.8), ease: 'power3.out' }, B(at + 1.5));
  }

  // ---- intro (beats 0 to 8)
  tl.fromTo('#brand', { opacity: 0 }, { opacity: 1, duration: B(1) }, 0);
  tl.fromTo('#k0', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: B(.6), ease: 'power3.out' }, 0);
  K.rise(tl, W0, .5, .25, 1);
  tl.fromTo('#chat', { y: 1000 }, { y: 0, duration: B(1), ease: 'power3.out' }, B(4));

  // ---- 01 send clips (8 to 16)
  swapOut('#b0', 7.5); swapIn('#b1', W[1], 8);
  K.row(tl, '#r1', 8.6);
  $$('#r1 .clips3 div').forEach(function (c, i) { tl.fromTo(c, { y: -70, opacity: 0, rotation: [-9, 7, -5][i] }, { y: 0, opacity: 1, rotation: [-3, 2, -1][i], duration: B(.7), ease: 'back.out(2)' }, B(9 + i - .3)); });
  K.row(tl, '#r2', 12);
  tl.fromTo($$('#vb i'), { scaleY: .1 }, { scaleY: 1, duration: B(.5), stagger: B(.08), ease: 'power2.out' }, B(12.3));

  // ---- 02 say what you want (16 to 24)
  swapOut('#b1', 15.5); swapIn('#b2', W[2], 16);
  K.row(tl, '#r3', 16.5);
  K.row(tl, '#r4', 17.5, .4);
  [18, 19].forEach(function (x) { tl.fromTo($$('#dots i'), { y: 0, opacity: .45 }, { y: -7, opacity: 1, duration: B(.17), stagger: B(.17), yoyo: true, repeat: 1, ease: 'power1.out' }, B(x)); });
  tl.to('#r4', { height: 0, opacity: 0, duration: B(.3) }, B(19.7));
  K.row(tl, '#r5', 20);
  $$('#chips .chip').forEach(function (c, i) { tl.fromTo(c, { opacity: 0, scale: .6 }, { opacity: 1, scale: 1, duration: B(.5), ease: 'back.out(3)' }, B(20.5 + i * .5)); });

  // ---- 03 get Reels: the frame draws before the drop, the car lands on it (beat 24)
  swapOut('#b2', 23.5); swapIn('#b3', W[3], 24);
  tl.to('#chat', { y: 1000, duration: B(1), ease: 'power3.in' }, B(22));
  tl.set('#reel', { opacity: 1 }, B(22.5));
  K.frame(tl, '#gf', 22.5, .25);
  tl.fromTo(M.dot, { opacity: 0 }, { opacity: 1, duration: B(.2) }, B(23.5));
  for (var r = 8; r < 16; r++) M.step(tl, r, 16 + r, r === 8 ? 1.5 : 1.22);
  tl.set($$('#mt .wave i').slice(0, 16), { backgroundColor: 'rgba(13,12,10,.3)' }, B(23.5));
  var shots = $$('#ph .shot');
  K.cut(tl, shots, 0, 24, 4, 1.16, 1);
  K.cut(tl, shots, 1, 28, 2, 1.12, 1.03);
  K.cut(tl, shots, 2, 30, 2, 1.12, 1.03);
  tl.fromTo('#fl', { opacity: 1 }, { opacity: 0, duration: B(1), ease: 'power2.out', immediateRender: false }, B(24));
  tl.fromTo('#gf', { scale: 1.045 }, { scale: 1, duration: B(.6), ease: 'back.out(3)', immediateRender: false }, B(24));
  tl.fromTo('#glow', { scale: 1.3, opacity: 1 }, { scale: 1, opacity: .8, duration: B(2), ease: 'power2.out', immediateRender: false }, B(24));
  tl.fromTo('#ec', { opacity: 0 }, { opacity: 1, duration: B(.5) }, B(32));
  tl.fromTo($$('#ec > *'), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: B(.6), stagger: B(.2), ease: 'power3.out' }, B(32));
  $$('#qa .q').forEach(function (q, i) { tl.fromTo(q, { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: B(.6), ease: 'back.out(2)' }, B(26 + i)); });
  tl.fromTo('#okb', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: B(.6), ease: 'power3.out' }, B(29));
  tl.fromTo('#okb', { scale: .92 }, { scale: 1, duration: B(.6), ease: 'back.out(3)', immediateRender: false }, B(34));
  tl.fromTo('#okb i', { opacity: 0 }, { opacity: 1, duration: B(.3) }, B(34));

  // ---- brand kit (36 to 48)
  swapOut('#b3', 35.5); swapIn('#b4', W[4], 36);
  tl.to('#reel', { opacity: 0, x: 60, duration: B(.5), ease: 'power2.in' }, B(35.5));
  tl.fromTo('#kit', { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: B(.6), ease: 'power3.out', immediateRender: false }, B(36));
  tl.fromTo('#scan', { x: 0, opacity: 1 }, { x: 300, duration: B(1.5), ease: 'power1.inOut', immediateRender: false }, B(37));
  tl.set('#scan', { opacity: 0 }, B(38.5));
  var cols = Lk.c, sws = $$('#sws .sw');
  sws.forEach(function (s, i) {
    var at = 38.5 + i;
    tl.set($('i', s), { backgroundColor: cols[i] }, B(at));
    tl.fromTo(s, { opacity: 0, scale: .3, y: -20 }, { opacity: 1, scale: 1, y: 0, duration: B(.8), ease: 'back.out(2.6)' }, B(at));
    // the colour code settles letter by letter (fixed sequence, no randomness)
    var b = $('b', s), hex = cols[i];
    for (var j = 1; j <= 6; j++) tl.set(b, { textContent: hex.slice(0, j + 1) + '------'.slice(j) }, B(at + j / 7));
  });
  tl.fromTo('.tpl', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: B(.8), stagger: B(.5), ease: 'power3.out' }, B(41));
  K.frame(tl, '#t1', 41.5, .25); K.frame(tl, '#t2', 42, .25);
  // two more dealers: the colours move in one beat, the frame redraws in the new accent
  [['lindner', 44], ['velvet', 46]].forEach(function (x) {
    var L = K.LOGOS[x[0]], at = x[1];
    tl.to('#kit', { '--d-bg': L.c[0], '--d-ink': L.c[1], '--d-acc': L.c[2], duration: B(1), ease: 'power2.inOut' }, B(at));
    // sets, not callbacks: a seek never fires callbacks, a set is replayed exactly
    tl.set($$('#kit .dn'), { textContent: L.name }, B(at));
    tl.set($('#kit .dl'), { innerHTML: L.svg }, B(at));
    tl.set('#logobox', { innerHTML: L.svg }, B(at));
    sws.forEach(function (s, i) { tl.set($('i', s), { backgroundColor: L.c[i] }, B(at + .25 * i)); tl.set($('b', s), { textContent: L.c[i] }, B(at + .25 * i)); });
    ['#t1', '#t2'].forEach(function (t) { tl.fromTo($$(t + ' .edges path'), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: B(.25), stagger: B(.25), ease: 'none', immediateRender: false }, B(at)); });
  });

  // ---- pricing (48 to 58)
  swapOut('#b4', 47.5); swapIn('#b5', W[5], 48);
  tl.to('#kit', { opacity: 0, x: 60, duration: B(.5), ease: 'power2.in' }, B(47.5));
  tl.set('#price', { opacity: 1 }, B(48));
  tl.fromTo('#price .plan', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: B(.8), stagger: B(.5), ease: 'power3.out' }, B(48.5));
  OC.forEach(function (cs, i) { K.roll(tl, cs, 49 + i * .5, 1.5); });
  tl.fromTo('#need', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: B(.6), ease: 'back.out(2)' }, B(51.5));
  K.frame(tl, '#pfr', 52, .5);
  tl.fromTo('#toks .tok', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: B(.6), stagger: B(.5), ease: 'power3.out' }, B(54.5));

  // ---- the end (58 to 64)
  tl.to(['#b5', '#price', '#brand'], { opacity: 0, duration: B(.5) }, B(57.5));
  tl.set('#end', { opacity: 1 }, B(58));
  tl.fromTo('#emark .mk', { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: B(1), stagger: B(.25), ease: 'power2.inOut' }, B(58));
  tl.fromTo('#ename', { opacity: 0, y: 30, letterSpacing: '.06em' }, { opacity: 1, y: 0, letterSpacing: '-.012em', duration: B(1.2), ease: 'power3.out' }, B(58.5));
  K.rise(tl, tA, 59.5, .25, 1); K.rise(tl, tB, 60.5, .25, 1);
  tl.fromTo('#ecta', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: B(.8), ease: 'back.out(2)' }, B(61.5));
  tl.fromTo('#esub', { opacity: 0 }, { opacity: 1, duration: B(.8) }, B(62));
  tl.fromTo('#glow', { left: 1410 }, { left: 960, duration: B(2), ease: 'power2.inOut', immediateRender: false }, B(57.5));

  window.__timelines = window.__timelines || {};
  window.__timelines.explainer = tl;
})();
</script>
